<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Festi Grill '26 — cadre story 1080×1920</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    width: 1080px; height: 1920px;
    font-family: 'Inter', sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  .fire-frame {
    position: absolute; inset: 0;
    box-shadow:
      inset 0  36px 55px -18px rgba(220, 60, 15, 0.85),
      inset 0 -36px 55px -18px rgba(220, 60, 15, 0.85),
      inset  32px 0 55px -18px rgba(220, 60, 15, 0.85),
      inset -32px 0 55px -18px rgba(220, 60, 15, 0.85);
    pointer-events: none;
  }
  .leaf { position: absolute; font-size: 78px; opacity: 0.85; }
  .leaf.tl { top: 6px; left: 10px; transform: rotate(-30deg); }
  .leaf.tr { top: 6px; right: 10px; transform: rotate(30deg) scaleX(-1); }
  .leaf.bl { bottom: 6px; left: 10px; transform: rotate(-150deg); }
  .leaf.br { bottom: 6px; right: 10px; transform: rotate(150deg) scaleX(-1); }
  .top {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 44px 60px 50px;
    background: linear-gradient(180deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 70%, rgba(0,0,0,0));
    text-align: center;
    z-index: 10;
  }
  .brand { color: #E4B93A; font-family: 'Caveat', cursive; font-size: 32px; letter-spacing: 1.5px; margin-bottom: 12px; }
  .title-festi { font-family: 'Caveat', cursive; font-size: 54px; color: #fff; line-height: 0.9; margin-bottom: -6px; }
  .title-grill { font-family: 'Anton', sans-serif; font-size: 120px; color: #E4B93A; letter-spacing: 6px; line-height: 1; text-shadow: 3px 3px 0 rgba(0,0,0,0.6); }
  .tagline {
    color: #fff; font-size: 20px; letter-spacing: 3px; text-transform: uppercase;
    margin-top: 14px; opacity: 0.9;
  }
  .bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 40px 60px 60px;
    background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 70%, rgba(0,0,0,0));
    text-align: center;
    z-index: 10;
  }
  .bottom .date {
    font-family: 'Anton', sans-serif; font-size: 60px; color: #E4B93A;
    letter-spacing: 5px; margin-bottom: 10px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.6);
  }
  .bottom .meta {
    color: #fff; font-size: 22px; letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 12px;
  }
  .bottom .meta strong { color: #E4B93A; }
  .bottom .location {
    color: #fff; font-size: 18px; letter-spacing: 3px; opacity: 0.9;
    padding: 12px 20px;
    border: 1px solid rgba(228, 185, 58, 0.5);
    display: inline-block;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="fire-frame"></div>
  <div class="leaf tl">🌿</div>
  <div class="leaf tr">🌿</div>
  <div class="leaf bl">🌿</div>
  <div class="leaf br">🌿</div>

  <div class="top">
    <div class="brand">New Wine · CHURCH</div>
    <div class="title-festi">Festi</div>
    <div class="title-grill">GRILL '26</div>
    <div class="tagline">Meilleures viandes servies avec alloco &amp; attiéké</div>
  </div>

  <div class="bottom">
    <div class="date">12 SEPT · 15H</div>
    <div class="meta">🔥 Grillades · Musique · <strong>7 Sphères d'Influence</strong></div>
    <div class="location">📍 Maison de la destinée · Bonoumin</div>
  </div>
</body>
</html>
