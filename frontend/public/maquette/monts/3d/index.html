<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Ancienne version 3D des 7 Monts, conservée pour comparaison avec la nouvelle (/monts). Non indexée. -->
<meta name="robots" content="noindex, nofollow">
<base href="/maquette/">
<title>Les 7 Monts en 3D (ancienne version) · New Wine Church · Maquette</title>
<meta name="theme-color" content="#3A0C18">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css?v=7">
<link rel="stylesheet" href="css/pages.css?v=7">
<link rel="stylesheet" href="css/vues.css?v=7">
</head>
<body data-page="monts" style="background:var(--profond)">
<div id="layoutTop"></div>
<main id="top">
<section class="monts" id="monts" style="padding-top:calc(var(--nav-h) + 48px)">
  <div class="wrap monts-head">
    <p class="mt-alt" style="margin:0 0 18px"><a class="link-arrow" href="monts/" style="color:var(--ivoire)">← Revenir à la nouvelle version</a></p>
    <header class="pillar-head">
      <span class="pillar-n" aria-hidden="true">3</span>
      <div class="pillar-title"><p class="kicker">Impacter · version 3D</p><h1 class="h2 display">7 monts.<br><em class="serif">7 sphères à gagner.</em></h1></div>
      <p class="lead pillar-lead">Ancienne proposition : un relief topographique en 3D où chaque sommet est un mont. Touche un sommet pour le découvrir.</p>
    </header>
  </div>
  <div class="monts-stage" id="montsStage">
    <canvas class="monts-gl" id="montsGl" aria-hidden="true"></canvas>
    <div class="monts-labels" id="montsLabels"></div>
    <div class="monts-vignette" aria-hidden="true"></div>
  </div>
  <div class="wrap monts-dock">
    <ol class="mont-list" id="montList" aria-label="Les 7 monts"></ol>
    <article class="mont-card" id="montCard" aria-live="polite">
      <div class="mont-card-img"><img id="montImg" src="img/s/m-hermon.webp" alt=""></div>
      <div class="mont-card-body">
        <p class="mont-sphere mono" id="montSphere">La Famille</p>
        <h3 class="mont-name display" id="montName">Hermon</h3>
        <p class="mont-q serif" id="montQ">« Tu aimes te sentir en famille ? »</p>
        <p class="mont-txt" id="montTxt"></p>
        <div class="mont-foot"><span class="mono" id="montRef">Psaume 133:3</span><button class="btn btn-ivoire btn-sm" type="button" id="montJoin">Rejoindre ce mont</button></div>
      </div>
    </article>
  </div>
</section>
</main>
<div id="layoutBottom"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/layout.js?v=7"></script>
<script src="js/monts.js?v=7"></script>
<script src="js/site.js?v=7"></script>
</body>
</html>
