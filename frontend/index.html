<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Logo NWC en favicon (PNG haute résolution) -->
    <link rel="icon" type="image/png" href="/logos/logo_newwine.png" />
    <link rel="apple-touch-icon" href="/logos/logo_newwine.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />

    <!-- Référencement et partage social -->
    <title>New Wine Church — Sauvé pour Sauver</title>
    <meta name="description" content="New Wine Church (NWC) — Église de jeunes adultes à Abidjan, Côte d'Ivoire. Une armée de Christ levée pour transformer cette génération. Sauvé pour Sauver." />
    <meta name="keywords" content="New Wine Church, NWC, église, jeunes, Abidjan, Cocody, Bonoumin, Côte d'Ivoire, Christ, sauvé, évangélisation, Pasteur Georges Amoako-Prempeh" />
    <meta name="author" content="New Wine Church" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) —
         SURCHARGE TEMPORAIRE POUR CAMPAGNE FESTI GRILL '26 : les crawlers
         (WhatsApp, FB, etc.) ne lisent pas le JS, donc les meta tags de la
         SPA React ne sont jamais vus. On surcharge ici avec l'affiche
         Festi Grill pour que tous les liens partagés affichent l'event
         principal du moment. À rétablir sur le logo NWC après la campagne
         (28 août 2026) ou remplacer par un vrai système de prerendering. -->
    <meta property="og:title" content="Festi Grill '26 — New Wine Church" />
    <meta property="og:description" content="Après le bal, on continue l'aventure. Grillades, musique, ambiance village · Samedi 12 septembre 2026, Maison de la destinée, Bonoumin. Réserve ta place — inscription gratuite." />
    <meta property="og:type" content="website" />
    <!-- Image hébergée directement dans /public frontend — plus fiable que
         de dépendre du storage Laravel/symlink Hostinger. -->
    <meta property="og:image" content="https://newinechurch.org/images/festi-grill-26-og.jpg" />
    <meta property="og:image:secure_url" content="https://newinechurch.org/images/festi-grill-26-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="853" />
    <meta property="og:image:height" content="1280" />
    <meta property="og:image:alt" content="Festi Grill '26 — Meilleures viandes servies avec alloco & attiéké" />
    <meta property="og:url" content="https://newinechurch.org/evenements/festi-grill-26/inscription" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Festi Grill '26 — New Wine Church" />
    <meta name="twitter:description" content="Grillades, musique, ambiance village · 12 septembre 2026, Bonoumin. Réserve ta place gratuitement." />
    <meta name="twitter:image" content="https://newinechurch.org/images/festi-grill-26-og.jpg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Préconnexion + DNS-prefetch pour Google Fonts (gain TTFB ~100ms) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- === Polices home publique (refonte "Magazine Drop") === -->
    <!-- Anton : display impact (headlines XXL "SAUVÉ. POUR SAUVER.") -->
    <!-- Fraunces : serif éditorial expressif (pull-quotes, scripture) — axes optiques -->
    <!-- Geist Mono : tags + numéros Mobile Money — typo Vercel/Linear très contemporaine -->
    <!-- display=swap → pas de FOIT, font invisible jusqu'au load (UX safe) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Preload du logo NWC (LCP du hero quand pas d'image bg) -->
    <link rel="preload" as="image" href="/logos/logo_newwine.png" fetchpriority="high" />
  </head>
  <body class="bg-ink-950 text-white">
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif">
        Cette application nécessite JavaScript pour fonctionner.
        Veuillez activer JavaScript dans votre navigateur.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
